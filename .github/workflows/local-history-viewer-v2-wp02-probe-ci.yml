name: Local History Viewer V2 WP-02 Probe CI

on:
  push:
    paths:
      - ".github/workflows/local-history-viewer-v2-wp02-probe-ci.yml"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/runtime/**"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/tests/automation/specs/browser-sql-probe.spec.js"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/tests/unit/browser-sql-probe-build.test.js"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/package.json"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/package-lock.json"

permissions:
  contents: read

jobs:
  probe:
    name: WP-02 targeted Chromium probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        working-directory: scripts/research/market-data/leumi/prototypes/local-history-viewer-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure Chromium is installed
        run: npx playwright install chromium

      - name: Run targeted WP-02 Chromium spec
        run: npx playwright test tests/automation/specs/browser-sql-probe.spec.js

      - name: Build C01 live probe artifacts
        run: npm run build:browser-sql-probe

      - name: Upload C01 live probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-history-viewer-v2-c01-live-probe-${{ github.sha }}
          path: |
            scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/runtime/dist/market-flow-v2.browser-sql-probe.js
            scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/runtime/dist/market-flow-v2.browser-sql-probe.bookmarklet.txt
          if-no-files-found: error
          retention-days: 7
