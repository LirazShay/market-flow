name: Local History Viewer V2 Fast CI

on:
  push:
    paths:
      - ".github/workflows/local-history-viewer-v2-fast-ci.yml"
      - "AGENTS.md"
      - "README.md"
      - "PROJECT_CONTEXT.md"
      - "docs/project/**/*.md"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/**/*.js"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/**/*.md"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/STATUS.json"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/package.json"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/local-history-viewer-v2-fast-ci.yml"
      - "AGENTS.md"
      - "README.md"
      - "PROJECT_CONTEXT.md"
      - "docs/project/**/*.md"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/**/*.js"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/**/*.md"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/STATUS.json"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/package.json"
      - "scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/package-lock.json"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Fast unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 3

    defaults:
      run:
        working-directory: scripts/research/market-data/leumi/prototypes/local-history-viewer-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install locked test/build dependencies
        run: npm ci --no-audit --no-fund

      - name: Build WP-03 live probe artifact
        run: npm run build:browser-sql-probe

      - name: Upload WP-03 live probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp03-live-probe
          path: |
            scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/runtime/dist/market-flow-v2.browser-sql-probe.js
            scripts/research/market-data/leumi/prototypes/local-history-viewer-v2/runtime/dist/market-flow-v2.browser-sql-probe.bookmarklet.txt
          if-no-files-found: error
          retention-days: 1

      - name: Run fast unit tests
        run: npm run test:unit
