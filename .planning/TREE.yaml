version: 1

root: "0"

nodes:
  "0":
    status: draft
    strategy: "Local History Viewer V2 operates simply and reliably on a localhost Node.js + native DuckDB authority while preserving the proven Leumi collection contract and all required user-facing SQL/history behavior."
    tactic: "Keep authenticated collection in the browser, cross one narrow loopback WebSocket boundary, centralize persistence/reads/Scanner in one Node service, adapt the existing Viewer, then verify/cut over and retire the rejected Browser-SQL path."
    parallel_assumptions:
      - "Real Leumi-origin browser→localhost WebSocket connectivity is already verified."
      - "D-045 fixes one local Node service as the authority boundary, so no browser-side SQL ownership is required."
      - "The existing V1-derived collector and Viewer provide reusable behavior rather than requiring a rewrite from scratch."
    necessary_assumptions: []
    sufficiency_assumptions:
      - "A correct transport/producer boundary, one correct persistent authority, preserved read surfaces, a safe Scanner, and verified cutover together cover the complete desired outcome."
      - "Operational simplicity is handled inside the single-service and cutover branches rather than by adding a separate deployment subsystem."
    success_evidence:
      - "A validated real/synthetic complete cycle can travel browser→Node and become one atomic DuckDB commit."
      - "Current Universe and Security Detail/History read the committed Node authority and preserve their public behavior."
      - "Dynamic SQL Scanner runs user-selected read-only SQL repeatedly without changing collector cadence or corrupting ingest."
      - "Only one producer can mutate the authority while multiple Viewer clients can read it."
      - "Fast CI, real-service integration, Chromium E2E against the local Fake Leumi site, one-command local demo, representative workload and final scoped live verification are green on the cutover candidate."
      - "Old Browser-SQL executable assets/issues are retired or archived only after replacement ownership exists."
    depends_on: []
    children:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"

  "1":
    status: approved
    strategy: "The authenticated browser sends only valid, well-defined market-data work to the local authority over one safe loopback protocol."
    tactic: "Reuse the existing validated universe/complete-cycle objects unchanged, wrap them in one small versioned WebSocket request/response protocol, replace browser persistence calls with Node acknowledgements, and fail closed if the local authority is unavailable."
    parallel_assumptions:
      - "The existing Recorder already produces a validated complete-cycle object before persistence."
      - "Native browser WebSocket to 127.0.0.1 is already proven on the real Leumi origin."
      - "The same-origin Viewer can later reuse the same generic browser WebSocket client with role=viewer."
    necessary_assumptions:
      - "Without a deterministic browser→Node boundary, Node cannot safely become the new persistence authority."
    sufficiency_assumptions:
      - "A shared protocol, a deterministic browser client, a Recorder persistence adapter, and fail-closed runtime lifecycle together cover every browser-side responsibility required to hand authority to Node."
      - "Server-side Origin enforcement, producer ownership and database semantics are deliberately owned by Node 2 rather than duplicated here."
    success_evidence:
      - "The existing validated universe and complete-cycle shapes cross the socket without a second market-data transformation."
      - "Recorder success remains commit-before-success: a cycle is successful in browser state only after the Node commit ACK."
      - "Local-service absence, rejection, timeout or disconnect never silently falls back to IndexedDB or lets cycles continue as if durable."
      - "Provider cookies/tokens/account/session browser data are absent from the protocol contract."
    depends_on: []
    children:
      - "1.1"
      - "1.2"
      - "1.3"
      - "1.4"

  "1.1":
    status: approved
    strategy: "Browser and Node share one deterministic protocol contract for producer operations."
    tactic: "Add a dual Node/browser pure module at transport/pure/protocol.js with protocol version 1, JSON encode/decode, one envelope {v,type,requestId,payload}, strict message-type validation, and the producer operation set client.hello, producer.session.start, producer.universe.replace, producer.cycle.commit, producer.cycle.failed, producer.heartbeat, producer.session.stop, response.ok and response.error."
    parallel_assumptions:
      - "A single shared pure module prevents browser/server protocol drift without adding a schema framework."
      - "The existing universe and complete-cycle objects are already the validated data-bearing contracts and should be transported as-is."
    necessary_assumptions:
      - "Without one shared protocol definition, browser and Node can disagree about request/response meaning and corrupt lifecycle ordering."
    sufficiency_assumptions: []
    success_evidence:
      - "Node unit tests round-trip representative universe/cycle fixtures through encode/decode while preserving null, zero, empty string and missing properties."
      - "Unknown versions/types, malformed envelopes and missing requestId values are rejected deterministically."
      - "The protocol schema contains no cookie, authorization, account or private browser-session fields."
    depends_on: []
    children: []

  "1.2":
    status: approved
    strategy: "Browser code has one predictable WebSocket request client that can be reused by producer and Viewer roles."
    tactic: "Add transport/websocket-client.js over native WebSocket using ws://127.0.0.1:8765, client.hello role/clientId handshake, monotonic request IDs, request correlation, a 30-second request timeout, explicit close, and rejection of every pending request on close/protocol error; do not add reconnect, offline queue or replay."
    parallel_assumptions:
      - "The real Leumi-origin smoke test already proves the browser can open this loopback socket."
      - "A generic request client is enough for producer now and Viewer/Scanner later."
    necessary_assumptions:
      - "Without request correlation and explicit failure behavior, Recorder lifecycle calls cannot safely wait for authoritative Node acknowledgements."
    sufficiency_assumptions: []
    success_evidence:
      - "Deterministic browser tests prove connect/hello, request↔response correlation, timeout, server error, malformed response and socket-close rejection."
      - "No request is sent before the hello handshake succeeds."
      - "No automatic retry/reconnect/replay occurs after failure."
    depends_on:
      - "1.1"
    children: []

  "1.3":
    status: approved
    strategy: "The existing Recorder hands lifecycle and complete-cycle persistence to Node without changing provider acquisition or complete-cycle validation."
    tactic: "Add a Recorder→Node persistence adapter that maps the current startSession, persistUniverse, commitSuccessfulCycle, recordFailedCycle, recordHeartbeat and stopSession boundaries to protocol requests; change recorder-loop.js to use that adapter instead of IndexedDB persistence while leaving pure config/universe/chunk/cycle/no-overlap logic intact; after a successful Node commit ACK, retain the existing metadata-only BroadcastChannel CYCLE_COMMITTED invalidation hint for Viewer refresh."
    parallel_assumptions:
      - "The current Recorder already separates provider/cycle construction from persistence methods closely enough to replace the adapter instead of rewriting collection logic."
      - "Node ACKs can return the sessionId/cycleId identities currently produced by IndexedDB."
    necessary_assumptions:
      - "Without replacing the persistence handoff, IndexedDB remains a co-authority and D-045 is not actually implemented."
    sufficiency_assumptions: []
    success_evidence:
      - "Characterization/unit tests for provider collection and pure cycle logic remain unchanged and green."
      - "A fake local service observes the exact session-start → universe → cycle/failure/heartbeat → stop request ordering."
      - "cycle.commit ACK returns the authoritative cycleId; response.error/timeout is treated as persistence failure and never exposes browser success."
      - "The new Recorder path performs no IndexedDB market-state writes; BroadcastChannel remains metadata-only and CYCLE_COMMITTED is published only after the Node commit ACK."
    depends_on:
      - "1.1"
      - "1.2"
    children: []

  "1.4":
    status: approved
    strategy: "Runtime lifecycle fails closed around the localhost authority instead of running a disconnected or duplicate producer."
    tactic: "Wire runtime launch to establish the WebSocket/hello before starting Recorder/provider work, surface service-unavailable/producer-rejected failures clearly, stop the Recorder when transport closes, wait for producer.session.stop ACK on normal stop, then close the socket; require explicit relaunch after failure."
    parallel_assumptions:
      - "Failing launch/operation is simpler and safer than background reconnection for this local daily tool."
      - "Node 2 will enforce the one-producer rule; browser runtime only needs to honor rejection."
    necessary_assumptions:
      - "Without fail-closed runtime wiring, the browser can keep polling or report success after losing the only durable authority."
    sufficiency_assumptions: []
    success_evidence:
      - "With no local service, runtime launch starts no Recorder and makes no provider request."
      - "A producer-already-active response starts no second Recorder."
      - "Mid-run socket loss prevents further cycle scheduling and rejects outstanding persistence work."
      - "After service recovery, an explicit relaunch creates a fresh connection/session; no old request is replayed."
    depends_on:
      - "1.2"
      - "1.3"
    children: []

  "2":
    status: approved
    strategy: "One local Node.js process is the sole durable SQL/history authority and commits complete cycles correctly."
    tactic: "Run one loopback-only WebSocket service with one file-backed DuckDB instance, one serialized producer write path, a minimal relational/raw-JSON schema, atomic full-cycle commits, and explicit restart recovery."
    parallel_assumptions:
      - "The maintained DuckDB Node API supports file-backed instances, normal SQL transactions and connection-scoped bulk appenders."
      - "The existing complete-cycle contract already gives Node all facts required for atomic persistence."
      - "One process/one writer removes the browser OPFS/Web-Lock ownership problem instead of relocating it."
    necessary_assumptions:
      - "Without one durable authority, history/current/Scanner cannot share coherent committed state."
    sufficiency_assumptions:
      - "Service ownership/security, schema/bootstrap, lifecycle persistence, successful-cycle atomicity, and restart recovery together cover the authority responsibilities needed before Viewer/Scanner read features are added."
      - "Viewer-specific read protocol and Scanner execution remain correctly owned by Nodes 3 and 4."
    success_evidence:
      - "A fresh service creates/reopens one local DuckDB file and becomes ready only after schema validation succeeds."
      - "Exactly one approved producer can mutate persistence; all producer writes execute serially."
      - "A successful complete cycle atomically appends history, replaces latest, records the cycle and updates session state before ACK."
      - "Any transaction failure leaves the previous latest/history authority coherent."
      - "After service restart, committed history/latest remain readable and stale running sessions are marked interrupted before a new producer session begins."
    depends_on: []
    children:
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
      - "2.5"

  "2.1":
    status: approved
    strategy: "The local service has one secure, deterministic process/connection ownership boundary."
    tactic: "Add local-service/server.mjs using Node http + ws@8.21.3 on 127.0.0.1:8765: expose only GET /healthz for readiness and WebSocket upgrade for application traffic; set maxPayload to 16 MiB, validate the exact production Origin before upgrade/hello, accept roles from the shared protocol, allow only one producer socket at a time, allow multiple viewer sockets, and dispatch producer writes through one serialized Promise chain."
    parallel_assumptions:
      - "Port binding already provides single service-process ownership; a second PID/lock-file system is unnecessary."
      - "A simple Promise tail is sufficient to prevent heartbeat/lifecycle/cycle transactions from interleaving on the writer connection."
    necessary_assumptions:
      - "Without server-side ownership/origin enforcement and serialized mutation, multiple clients can create ambiguous or overlapping authority."
    sufficiency_assumptions: []
    success_evidence:
      - "Node integration tests reject non-loopback binding configuration, wrong/missing Origin, unknown role, oversized payload and a second producer."
      - "Two viewer-role clients may coexist while the one producer remains active."
      - "Concurrent producer commands are observed executing in submission order, one at a time."
    depends_on:
      - "1.1"
    children: []

  "2.2":
    status: approved
    strategy: "DuckDB has a minimal durable schema that preserves raw market facts and the current/history authority contract."
    tactic: "Add local-service/database.mjs and schema-v1.sql; open @duckdb/node-api file local-service/data/market-flow-v2.duckdb by default (MARKET_FLOW_DB_PATH override for tests), ignore local-service/data/ in Git, and create schema_info plus sessions, universe, cycles, history and latest tables. Open the shared DuckDB instance with external access, extension autoload/autoinstall/community extensions and persistent secrets disabled, then lock configuration. Universe stores security_id, paper_name, updated_at_ms, map_heat_date_change + raw_map_heat JSON; history/latest store cycle/session/security/chunk/time metadata + raw_security JSON; cycles/sessions keep lifecycle/count metadata with chunks/error/config JSON; timestamps use BIGINT epoch-ms; schema v1 creates no sequences."
    parallel_assumptions:
      - "Keeping raw provider objects in JSON preserves unanticipated fields without building a large typed schema first."
      - "Metadata columns needed for identity/time/current/history queries can stay relational while raw source facts remain complete."
      - "A fresh-authority V1 schema is sufficient because legacy IndexedDB import is a non-goal."
    necessary_assumptions:
      - "Without a stable file/schema contract, persistence and later SQL reads cannot agree on durable meaning."
    sufficiency_assumptions: []
    success_evidence:
      - "Fresh DB bootstrap is deterministic and reopening the same file preserves rows."
      - "schema_info contains exactly version 1; an unknown schema version fails startup clearly instead of destructive reset or implicit migration."
      - "history primary key is (cycle_id, security_id); latest primary key is security_id; canonical IDs are VARCHAR."
      - "JSON round-trip tests preserve null, zero, empty string and missing-property distinctions from representative raw fixtures."
      - "No secondary indexes or migration framework are added before measured need."
    depends_on: []
    children: []

  "2.3":
    status: approved
    strategy: "Producer session, universe, heartbeat, failure and stop state are durable without making failed data current."
    tactic: "Implement local-service/producer-lifecycle.mjs on the serialized writer connection: allocate session IDs as COALESCE(MAX(session_id),0)+1 inside the serialized write transaction; start a running session; replace the complete validated universe in one transaction; update heartbeat/session counters; persist failed-cycle diagnostics only to cycles/session state; and stop the owning session explicitly."
    parallel_assumptions:
      - "The existing browser adapter sends already validated universe/cycle/failure objects, but Node still validates protocol/lifecycle ownership before persistence."
      - "Universe is a complete snapshot, so DELETE + bulk append inside one transaction is simpler than diff/upsert logic."
    necessary_assumptions:
      - "Without durable lifecycle ownership, cycle writes cannot prove which producer/session is allowed to mutate authority or expose truthful diagnostics."
    sufficiency_assumptions: []
    success_evidence:
      - "A producer can mutate only its active session; stale/wrong client/session commands fail."
      - "Universe replace is all-or-nothing and preserves full raw MapHeat JSON."
      - "Failed cycle persistence adds no history/latest rows and increments only failed-session diagnostics."
      - "Heartbeat cannot move backward and stop prevents later writes for that session."
    depends_on:
      - "2.1"
      - "2.2"
    children: []

  "2.4":
    status: approved
    strategy: "Each validated complete cycle becomes one atomic, coherent DuckDB authority update."
    tactic: "Implement local-service/cycle-persistence.mjs on the writer connection: BEGIN; allocate cycle_id as COALESCE(MAX(cycle_id),0)+1 on the serialized writer; insert the complete cycle metadata/chunks; bulk append one history row per security; DELETE all latest rows; bulk append the same complete cycle as the new latest snapshot; update owning session counters/heartbeat; flush/close appenders; COMMIT; return cycleId only after COMMIT, otherwise ROLLBACK and return an explicit error."
    parallel_assumptions:
      - "Every successful browser cycle is already a complete validated universe snapshot, so replacing latest wholesale is both simpler and semantically correct."
      - "DuckDB appenders use the connection transaction context, allowing bulk history/latest writes within one explicit transaction."
      - "No automatic request replay means cycle-level idempotency keys are not required initially."
    necessary_assumptions:
      - "Without one transaction spanning cycle/history/latest/session state, readers can observe a partial or mixed-cycle authority."
    sufficiency_assumptions: []
    success_evidence:
      - "For N securities, one commit produces exactly N history rows for the new cycle and exactly N latest rows, all with one returned cycleId."
      - "Fault injection at cycle insert, history append, latest replacement and session update proves rollback leaves previous latest/history/counters unchanged."
      - "ACK/cycleId is produced only after COMMIT completes."
      - "An ACK-lost/browser-disconnect case never triggers automatic resend; the already committed DB state remains valid."
    depends_on:
      - "2.2"
      - "2.3"
    children: []

  "2.5":
    status: approved
    strategy: "Service startup, shutdown and restart preserve only committed authority and recover stale runtime state clearly."
    tactic: "Add local-service/runtime.mjs to open DB and validate schema before listening, mark any persisted running session interrupted on startup, expose service readiness only after recovery, route protocol commands to lifecycle/cycle modules, and on SIGINT/SIGTERM stop accepting work, mark an active producer session interrupted if it did not stop normally, close sockets/connections and exit; add npm start:local-service as the single daily launch command."
    parallel_assumptions:
      - "DuckDB persistence already provides crash durability for committed transactions; application recovery only needs to repair stale session status, not replay market writes."
      - "The browser fail-closed policy guarantees a service restart disconnects the producer and requires an explicit fresh browser relaunch."
    necessary_assumptions:
      - "Without deterministic startup/restart behavior, stale running sessions or listening-before-ready states can violate the single-authority contract."
    sufficiency_assumptions: []
    success_evidence:
      - "Restart after committed cycles preserves latest/history and marks the old running session interrupted before accepting a new producer."
      - "Startup with invalid/unknown schema never opens the WebSocket listener."
      - "Graceful shutdown with a stopped session leaves it stopped; abrupt-service simulation leaves it interrupted, not running."
      - "One documented npm command starts the service; no Docker/service manager is required."
    depends_on:
      - "2.1"
      - "2.2"
      - "2.3"
      - "2.4"
    children: []

  "3":
    status: approved
    strategy: "Current Universe and Security Detail/History preserve their user-visible behavior while reading the Node authority."
    tactic: "Expose four narrow read requests from Node, reuse one viewer-role WebSocket client in the browser, keep the existing pure rendering/sorting/detail UI, replace only IndexedDB data adapters, and retain metadata-only BroadcastChannel as the post-commit refresh hint."
    parallel_assumptions:
      - "The existing Viewer rendering/sorting/navigation logic is largely independent of IndexedDB and can consume the same logical row shapes."
      - "Node can reconstruct those logical shapes from the typed metadata + raw JSON schema without creating a second data model."
      - "BroadcastChannel remains safe as a hint because every refresh rereads the Node authority."
    necessary_assumptions:
      - "The migration is incomplete if the existing browsing surfaces regress or retain IndexedDB as a co-authority."
    sufficiency_assumptions:
      - "Node read models, one browser data client, Current/diagnostics adapters, Detail/history adapters, and refresh/recovery parity together replace every Viewer dependency on IndexedDB while preserving the public UI contract."
      - "Dynamic SQL Scanner UI/query execution is deliberately excluded here and owned by Node 4."
    success_evidence:
      - "Current Universe renders the same 16-column model, sort/null/zero/scroll behavior from Node reads."
      - "Security Detail/History remains newest-first with 500-row pages and no duplicate/skip across equal timestamps."
      - "Known historical securities can still open by canonical securityId even if absent from the current universe."
      - "Manual and post-commit refresh perform Node reads only and never call the provider."
      - "Viewer reload/reopen works from committed Node state with no IndexedDB market-state read."
    depends_on: []
    children:
      - "3.1"
      - "3.2"
      - "3.3"
      - "3.4"
      - "3.5"

  "3.1":
    status: approved
    strategy: "Node exposes only the read operations and row shapes required by the existing Viewer."
    tactic: "Extend the shared protocol and add local-service/viewer-reads.mjs with viewer.current.get, viewer.security.get, viewer.history.page and viewer.status.get. current.get returns separate latestRows/universeRows matching the existing pure current-table inputs; security.get returns the newest known row for one canonical securityId; history.page returns at most 500 newest-first rows plus an opaque continuation; status.get returns the existing diagnostics logical shape. Normalize DuckDB BIGINT values to safe JS Numbers and JSON columns to objects before protocol serialization."
    parallel_assumptions:
      - "Returning existing logical row shapes keeps presentation code unchanged and avoids a new Viewer DTO layer."
      - "Four explicit operations are sufficient for the preserved Viewer and safer/simpler than a general SQL/read API."
    necessary_assumptions:
      - "Without authoritative Node read models, browser adapters either retain IndexedDB or duplicate SQL/database knowledge."
    sufficiency_assumptions: []
    success_evidence:
      - "current.get returns every latest row even when universe metadata is missing, plus the current universe rows separately."
      - "security.get resolves current latest first, otherwise newest persisted history for the requested securityId, and returns null only when no persisted row exists."
      - "history.page orders by collected_at_ms DESC, cycle_id DESC; continuation {securityId,collectedAtMs,cycleId} uses keyset predicates and LIMIT 501 to return 500 rows + hasMore without duplicate/skip at equal timestamps."
      - "status.get provides recorderState, lastCycle, rowCounts.latest/history and storage usage as the DuckDB file byte size with unavailable quota fields left null."
      - "Unsafe BIGINT conversion, malformed cursor/securityId or database read failure returns response.error rather than partial success."
    depends_on:
      - "1.1"
      - "2.2"
      - "2.4"
      - "2.5"
    children: []

  "3.2":
    status: approved
    strategy: "Viewer modules share one simple read connection to Node without becoming persistence owners."
    tactic: "Add viewer/node-data-client.js around the generic WebSocket client with role=viewer. Lazily create/reuse one viewer-role socket in the opener runtime for all Viewer windows, expose current/security/history/status request methods, discard the socket after transport failure, and allow the next explicit Viewer read/manual refresh to establish a fresh connection; no background reconnect or cache."
    parallel_assumptions:
      - "All Viewer windows originate from one running browser runtime, so one shared read socket is sufficient."
      - "The generic WebSocket client already owns hello/request correlation/timeout/error semantics."
    necessary_assumptions:
      - "Without one shared adapter, each Viewer module would duplicate socket lifecycle/protocol details."
    sufficiency_assumptions: []
    success_evidence:
      - "Multiple open Viewer windows can issue reads through the same viewer-role client without starting another Recorder."
      - "Transport/server errors reject the affected read visibly and discard the dead client."
      - "A later manual read can create a fresh viewer connection after service recovery; no request/result cache is used."
    depends_on:
      - "1.2"
      - "3.1"
    children: []

  "3.3":
    status: approved
    strategy: "Current Universe and existing header diagnostics render from Node with unchanged public semantics."
    tactic: "Replace current-table.js IndexedDB loadSnapshot with node-data-client current.get followed by the unchanged buildCurrentTableModel(latestRows, universeRows). Replace diagnostics-data.js IndexedDB/browser-storage reads with status.get while keeping existing diagnostics pure/model/render logic; represent DB file bytes as storage usage and unknown quota/free/ratio as null."
    parallel_assumptions:
      - "The current table's sorting/formatting/render logic already consumes logical rows, not IDB primitives."
      - "The diagnostics model only requires latest/history counts plus recorder/last-cycle/storage values and can truthfully represent unknown quota."
    necessary_assumptions:
      - "Without adapting Current and diagnostics reads, the main Viewer still depends on stale IndexedDB state."
    sufficiency_assumptions: []
    success_evidence:
      - "Existing 16 columns, default/toggled sorting, deterministic tie/null behavior, zero display, missing-universe fallback and sort/scroll preservation pass against Node-backed fixtures."
      - "Empty committed DB renders EMPTY; Node read failure renders ERROR, never empty success."
      - "Header recorder/last-cycle/count/storage values come only from Node status.get and retain truthful null semantics."
    depends_on:
      - "3.1"
      - "3.2"
    children: []

  "3.4":
    status: approved
    strategy: "Security Detail/History keeps its paging/navigation behavior and remains useful for persisted securities outside the current universe."
    tactic: "Replace history-data.js IndexedDB cursor reads with node-data-client history.page while keeping INITIAL_PAGE_SIZE=500. Adapt security-detail.js to open/refresh by canonical securityId: resolve display/current row with security.get when needed, preserve loaded depth and Back-to-Current sort/viewport state, and continue displaying persisted history even when the security is absent from current.get."
    parallel_assumptions:
      - "security-detail already treats continuation as data returned by history-data and can keep its rendering logic."
      - "A securityId-based entry point also prepares the shared Detail surface for later Scanner-row navigation without coupling Scanner into this node."
    necessary_assumptions:
      - "Without Node-backed paging and ID-based detail resolution, the second required Viewer surface either retains IndexedDB or loses historical-only securities."
    sufficiency_assumptions: []
    success_evidence:
      - "Initial/older pages are newest-first, fixed at 500, and equal-timestamp fixtures prove no duplicate/skip."
      - "Load-more preserves prior rows and continuation; refresh preserves at least the previously loaded depth."
      - "Current→Detail→Back preserves Current sort/viewport."
      - "Opening a known historical-only securityId succeeds; unknown securityId produces an explicit not-found state/error."
    depends_on:
      - "3.1"
      - "3.2"
    children: []

  "3.5":
    status: approved
    strategy: "Viewer live refresh and reload/reopen preserve current behavior without introducing server push or a second authority."
    tactic: "Keep the existing metadata-only BroadcastChannel CYCLE_COMMITTED path: producer publishes it only after Node commit ACK, viewer/live-refresh.js coalesces overlapping refresh hints and rereads Current/Detail/diagnostics from Node. Keep manual refresh read-only. Reuse existing bootstrap/reload recovery; it rebuilds the same shell and uses the shared viewer client instead of IndexedDB."
    parallel_assumptions:
      - "Existing isRefreshMessage already treats only CYCLE_COMMITTED as a data-refresh trigger."
      - "Notification loss is safe because startup/manual refresh always rereads authoritative Node state."
    necessary_assumptions:
      - "Without refresh/recovery adaptation, Viewer parity fails even if individual Node read operations are correct."
    sufficiency_assumptions: []
    success_evidence:
      - "One CYCLE_COMMITTED hint after ACK refreshes Current and selected Detail/diagnostics from Node."
      - "Refresh hints arriving during an in-flight refresh coalesce rather than overlap/burst."
      - "Manual refresh and viewer reload/reopen make no provider calls and recover from committed Node state."
      - "BroadcastChannel unavailable degrades to explicit manual refresh exactly as today."
      - "No market-row payload crosses BroadcastChannel and no IndexedDB market read is required by Viewer startup/refresh."
    depends_on:
      - "1.3"
      - "3.3"
      - "3.4"
    children: []

  "4":
    status: approved
    strategy: "The Dynamic SQL Scanner provides safe, truthful user-defined analytics on committed DuckDB history."
    tactic: "Harden the shared DuckDB instance, admit exactly one parsed SELECT statement, execute it on a dedicated Scanner connection, keep the repeat scheduler/config in one browser runtime controller, and render the exact SQL result schema/rows with no hidden analytical semantics."
    parallel_assumptions:
      - "The user is the local tool operator, but Scanner SQL still must not mutate market authority or access unrelated host files/network state."
      - "Browser-side scheduling is sufficient because the product does not require headless Scanner execution, query-version persistence or anchored scheduling."
      - "A separate Scanner connection on the same DuckDB instance sees committed state while producer writes remain owned by the serialized writer connection."
    necessary_assumptions:
      - "Dynamic SQL is an explicit V2 product requirement and cannot be replaced by hard-coded application ranking logic."
    sufficiency_assumptions:
      - "Database hardening/admission, one stateless Node execution request, one browser scheduler/controller and one schema-driven UI cover all required Scanner behavior."
      - "Advanced cancellation, streaming, query history and resource-governance mechanisms remain correctly excluded until evidence requires them."
    success_evidence:
      - "SELECT/JOIN/WHERE/GROUP BY/HAVING/ORDER BY/LIMIT/window/history/ranking queries execute against committed DuckDB data."
      - "Multi-statement, non-SELECT, external-file/network and configuration-changing SQL is rejected before authority mutation."
      - "0 rows is successful, query errors are visible, and returned column order/names/rows follow SQL exactly with no hidden LIMIT/sort/filter."
      - "At most one Scanner query executes at a time; interval misses do not queue or burst; collector cadence continues independently."
      - "A result row with a canonical security_id/SecurityId value may open the shared Detail/History surface without treating other result columns as authority."
    depends_on: []
    children:
      - "4.1"
      - "4.2"
      - "4.3"
      - "4.4"

  "4.1":
    status: approved
    strategy: "Scanner SQL cannot mutate the market database or escape into unrelated external state."
    tactic: "Harden the single DuckDBInstance at creation with enable_external_access=false, allow_community_extensions=false, autoinstall_known_extensions=false, autoload_known_extensions=false, allow_persistent_secrets=false and lock_configuration=true. Add local-service/scanner-sql-guard.mjs: reject empty SQL; connection.extractStatements(sql) must return count=1; prepare statement 0; prepared.statementType must equal StatementType.SELECT; destroy rejected/prepared resources cleanly. Execute accepted SQL only through the prepared statement on a dedicated Scanner connection. Schema v1 contains no sequences, so SELECT nextval cannot mutate durable ID state."
    parallel_assumptions:
      - "DuckDB's prepared-statement StatementType is parser/binder evidence and is stronger than text-prefix filtering."
      - "Global external-access/config hardening is compatible with Market Flow because the service needs only its already-open database file and built-in SQL."
      - "SELECT-only plus no durable sequences removes the known database-mutation path available from a SELECT expression."
    necessary_assumptions:
      - "Without engine-level hardening plus parsed statement admission, editable SQL could mutate authority or access host/network state."
    sufficiency_assumptions: []
    success_evidence:
      - "Unit/integration tests accept representative analytical SELECT/CTE/JOIN/window queries."
      - "Tests reject 0 statements, 2+ statements and prepared StatementTypes INSERT/UPDATE/DELETE/CREATE/DROP/ALTER/COPY/PRAGMA/SET/CALL/ATTACH/LOAD/TRANSACTION and other non-SELECT values."
      - "read_csv/read_parquet/read_json/external attach or extension loading fails under engine configuration even when referenced from SELECT."
      - "Scanner tests prove no sequence object exists and failed/rejected Scanner SQL leaves sessions/cycles/history/latest unchanged."
    depends_on:
      - "2.2"
    children: []

  "4.2":
    status: approved
    strategy: "Node executes one admitted Scanner query and returns a truthful JSON-safe result without storing Scanner state."
    tactic: "Extend the shared protocol with scanner.execute {sql}. Implement local-service/scanner-execution.mjs on one dedicated connection: admit via 4.1, execute the prepared SELECT, read all rows, return {columns:[{name,type}],rows,rowCount,executedAtMs,durationMs} using columnNames(), columnTypes().toString() and getRowsJson(). Preserve duplicate column names/order by returning rows as arrays, not row objects. Do not inject LIMIT/ORDER/filter or persist SQL/config/results."
    parallel_assumptions:
      - "The initial product explicitly requires truthful 0..N results and does not require mandatory streaming or hidden limits."
      - "Json result conversion avoids BigInt/non-JSON wire failures while retaining typed column metadata separately."
    necessary_assumptions:
      - "Without one exact execution/result contract, browser scheduling/UI would have to understand DuckDB internals or invent analytical semantics."
    sufficiency_assumptions: []
    success_evidence:
      - "0 rows returns success with exact columns and empty rows."
      - "Duplicate/ordered column names and row values round-trip without object-key loss."
      - "SQL errors return response.error and never stop/rollback unrelated Recorder ingest."
      - "Queries run on a separate Scanner connection and observe only committed database state."
    depends_on:
      - "1.1"
      - "2.2"
      - "4.1"
    children: []

  "4.3":
    status: approved
    strategy: "One browser runtime owns the active Scanner config and repeats executions without overlap or catch-up bursts."
    tactic: "Add scanner/controller.js in the opener runtime with draft state plus one active {sql,intervalMs,generation}. activate() validates non-empty SQL and positive-integer intervalMs, replaces the active generation, runs immediately when no execution is active, then schedules the next run with setTimeout(intervalMs) only after the prior run settles. If Activate occurs during a run, do not cancel it; ignore its stale result and start the newest generation after it settles. stop() clears future scheduling. Reuse viewer/node-data-client for scanner.execute; no persistence/background reconnect/query history."
    parallel_assumptions:
      - "Completion-based delay satisfies the product because anchored scheduling is explicitly not required."
      - "Generation replacement is enough to switch configs without implementing query cancellation/preemption."
    necessary_assumptions:
      - "Without one controller, UI timers can overlap queries or create multiple active configs."
    sufficiency_assumptions: []
    success_evidence:
      - "Activation is explicit and runs the selected SQL once immediately."
      - "Slow execution never overlaps a second execution; missed time creates no queued catch-up."
      - "Re-activation during a run never cancels it, never renders its stale result, and continues only with the newest config."
      - "stop(), Viewer/runtime close and transport failure leave no scheduled execution."
      - "Changing Scanner SQL/interval never changes Recorder config/cadence."
    depends_on:
      - "3.2"
      - "4.2"
    children: []

